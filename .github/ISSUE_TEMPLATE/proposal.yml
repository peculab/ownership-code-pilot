name: Project proposal
description: Propose a small feature, experiment, use case, or evaluation.
title: "[Proposal] "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem, user, and evidence
      description: What have you observed? Separate evidence from assumptions.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Smallest useful outcome
      description: What can be reviewed within one week?
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and limitations
      description: How will we know whether it helped, and what will it not prove?
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data, safety, cost, and dependencies
      description: Explain allowed inputs, human review, model/Token assumptions, and anything blocked.
    validations:
      required: true
