name: 學生自提題目／Student proposal
description: 從觀察與證據提出一週內能驗證的小題目。
title: "[提案] "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: 我觀察到什麼問題？要幫助誰？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 有哪些依據？哪些仍是推測？
      description: 提供可分享的來源、匿名摘要或可重現紀錄。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 一週內能交出什麼？
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 怎樣判斷有幫助？
      description: 說明檢查方式、可觀察結果與限制。
    validations:
      required: true
  - type: textarea
    id: support
    attributes:
      label: 預計日期、需要的資料與協助
    validations:
      required: true
