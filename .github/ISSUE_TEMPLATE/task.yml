name: Contribution task
description: Define one small, reviewable, and verifiable project outcome.
title: "[Task] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Who benefits, and what question should this task answer?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Deliverable
      description: Name the file, code, design, dataset, or evaluation result reviewers will see.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Allowed inputs and dependencies
      description: Use synthetic, public, or explicitly approved material. Link blocking Issues.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Completion criteria
      value: |
        - [ ] Result is reproducible or traceable
        - [ ] Evidence and interpretation are distinguishable
        - [ ] Safety, privacy, and data rules are satisfied
        - [ ] Limitations are documented
        - [ ] Pull Request links this Issue
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Expected effort
      options: ["1–2 hours", "2–4 hours", "About one day", "Up to one week", "Needs scoping"]
    validations:
      required: true
  - type: textarea
    id: claim
    attributes:
      label: How to claim or help
      value: |
        Comment with your proposed approach, deliverable, expected date/time zone, and help needed. Wait for scope confirmation before a large change.
    validations:
      required: true
